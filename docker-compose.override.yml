# Chargé automatiquement par `docker compose up` pour le développement local.
# Publie Postgres et ML sur le host pour debug (psql, curl Flask).
# Mode production-like sans ports host :
#   docker compose -f docker-compose.yml up -d
# (sans ce fichier override)

services:
  postgres:
    ports:
      - "5432:5432"

  ml-service:
    ports:
      - "5000:5000"
