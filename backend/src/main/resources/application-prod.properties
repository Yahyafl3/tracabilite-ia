# Profil production — aucune valeur secrète par défaut
# Les variables JWT_SECRET, SPRING_DATASOURCE_* / DATABASE_* sont obligatoires (voir ProductionEnvironmentValidator).

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

app.demo.seed-enabled=false

# OpenAPI / Swagger désactivés
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator minimal
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT courte durée (1h) — override via JWT_EXPIRATION_MS
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Token interne obligatoire (fail-fast via ProductionEnvironmentValidator)
ml.service.token=${ML_SERVICE_TOKEN}

# Rate limiting
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-per-minute=5
app.rate-limit.password.capacity=5
app.rate-limit.password.refill-per-minute=2
app.rate-limit.export.capacity=20
app.rate-limit.export.refill-per-minute=10
app.rate-limit.ml.capacity=60
app.rate-limit.ml.refill-per-minute=30

# Resilience ML (timeouts RestClient — circuit breaker Resilience4j optionnel ultérieur)
ml.service.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
ml.service.read-timeout-ms=${ML_READ_TIMEOUT_MS:15000}

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.pfa.tracabilite_ia=INFO
logging.level.org.hibernate.SQL=WARN
