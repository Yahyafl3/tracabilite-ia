# Profil local / Docker demo — secrets faibles acceptés uniquement ici
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Seed comptes démo autorisé
app.demo.seed-enabled=true

# Token interne Spring ↔ ML (local demo — remplacer en prod)
ml.service.token=${ML_SERVICE_TOKEN:local-dev-ml-token-not-for-prod-use}

# Swagger ouvert en local
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

logging.level.org.springframework.security=INFO
logging.level.com.pfa.tracabilite_ia=INFO
