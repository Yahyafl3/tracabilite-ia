# Profil tests unitaires / intégration (CI GitHub Actions + local)
# V1/V2 Flyway sont des ALTER conditionnels : sur base vide elles ne créent pas
# les tables de base. Hibernate create-drop bootstrap le schéma ; Flyway applique
# ensuite l'historique de migration. validate seul échouerait sur DB vide.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.demo.seed-enabled=false
ml.service.token=${ML_SERVICE_TOKEN:test-ml-token-for-unit-tests-only}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=WARN
logging.level.com.pfa.tracabilite_ia=INFO
