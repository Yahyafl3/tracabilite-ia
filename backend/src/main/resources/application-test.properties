# Profil tests unitaires / intégration (CI GitHub Actions + local)
# Use PostgreSQL with Hibernate DDL auto-generation
# Flyway disabled for tests to avoid migration validation errors
# create-drop détruit le schéma ciblé : sans cette URL dédiée, un run local retombe sur
# le défaut de application.properties, c'est-à-dire la base de démonstration.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tracabilite_ia_test}
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway for tests
spring.flyway.enabled=false

app.demo.seed-enabled=false
ml.service.token=${ML_SERVICE_TOKEN:test-ml-token-for-unit-tests-only}
app.backup.dir=target/test-backups

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=WARN
logging.level.com.pfa.tracabilite_ia=INFO
