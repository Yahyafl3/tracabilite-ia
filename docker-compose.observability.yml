# Observabilité optionnelle — ne pas démarrer en production sans authentification Grafana.
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tracabilite-prometheus
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - tracabilite-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: tracabilite-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - tracabilite-network
    restart: unless-stopped
