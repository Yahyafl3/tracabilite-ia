services:
  postgres:
    # Production-like : pas de publication host — réseau Docker uniquement
    expose:
      - "5432"
    networks:
      - tracabilite-internal

  ml-service:
    expose:
      - "5000"
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token-not-for-prod-use}
    networks:
      - tracabilite-internal

  backend:
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token-not-for-prod-use}
      ML_SERVICE_URL: http://ml-service:5000
    networks:
      - tracabilite-internal
      - tracabilite-edge

  frontend:
    networks:
      - tracabilite-edge

networks:
  tracabilite-internal:
    driver: bridge
    internal: false
  tracabilite-edge:
    driver: bridge
