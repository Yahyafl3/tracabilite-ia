services:
  postgres:
    image: postgres:16-alpine
    container_name: tracabilite-postgres
    environment:
      POSTGRES_DB: tracabilite_ia
      POSTGRES_USER: tracabilite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracabilite123}
    # Pas de ports: host — accessibles uniquement via réseau Docker (voir override local)
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tracabilite-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracabilite -d tracabilite_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: tracabilite-backend
    # DNS publics + fallback hosts : le resolver Docker Windows échoue parfois
    # (api.groq.com, api.resend.com → "bad address") alors que le host résout correctement.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.groq.com:172.64.149.20"
      - "api.resend.com:104.20.29.242"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/tracabilite_ia}
      SPRING_DATASOURCE_USERNAME: tracabilite
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-tracabilite123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-true}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      PORT: "8080"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ML_SERVICE_URL: http://ml-service:5000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token-not-for-prod-use}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_1: ${OPENROUTER_MODEL_1:-meta-llama/llama-3.3-70b-instruct:free}
      OPENROUTER_MODEL_2: ${OPENROUTER_MODEL_2:-google/gemma-4-26b-a4b-it:free}
      OPENROUTER_MODEL_3: ${OPENROUTER_MODEL_3:-openai/gpt-oss-20b:free}
      OPENROUTER_AGENT_1_FALLBACK: ${OPENROUTER_AGENT_1_FALLBACK:-}
      OPENROUTER_AGENT_2_FALLBACK: ${OPENROUTER_AGENT_2_FALLBACK:-}
      OPENROUTER_AGENT_3_FALLBACK: ${OPENROUTER_AGENT_3_FALLBACK:-}
      OPENROUTER_USE_FREE_ROUTER: ${OPENROUTER_USE_FREE_ROUTER:-false}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Tracabilite-IA}
      OPENROUTER_AGENT_DELAY_MS: ${OPENROUTER_AGENT_DELAY_MS:-3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL_1: ${GROQ_MODEL_1:-groq/compound-mini}
      GROQ_MODEL_2: ${GROQ_MODEL_2:-openai/gpt-oss-120b}
      GROQ_MODEL_3: ${GROQ_MODEL_3:-openai/gpt-oss-20b}
      GROQ_CONNECT_TIMEOUT_MS: ${GROQ_CONNECT_TIMEOUT_MS:-10000}
      GROQ_READ_TIMEOUT_MS: ${GROQ_READ_TIMEOUT_MS:-120000}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-2}
      GROQ_AGENT_DELAY_MS: ${GROQ_AGENT_DELAY_MS:-1000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      APP_BACKUP_DIR: /app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tracabilite-internal
      - tracabilite-edge
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracabilite-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tracabilite-edge
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
      network: host
    container_name: tracabilite-ml-service
    # Pas de ports: host — accessible uniquement depuis backend (réseau interne)
    expose:
      - "5000"
    environment:
      PORT: "5000"
      ML_RANDOM_STATE: "42"
      DATASETS_DIR: /datasets
      ML_REQUIRE_CHECKSUM: ${ML_REQUIRE_CHECKSUM:-false}
      ML_CORS_ORIGINS: ${ML_CORS_ORIGINS:-*}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token-not-for-prod-use}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - tracabilite-internal
    restart: unless-stopped
    volumes:
      - ./ml-service/artifacts:/app/artifacts
      - ./ml-service/models:/app/models
      - ./datasets:/datasets

networks:
  tracabilite-internal:
    driver: bridge
    name: tracabilite-internal
  tracabilite-edge:
    driver: bridge
    name: tracabilite-edge

volumes:
  postgres_data:
