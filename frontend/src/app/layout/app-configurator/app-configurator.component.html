<div class="layout-configurator" role="dialog" [attr.aria-label]="'configurator.aria' | translate">
  <header class="layout-configurator__header">
    <strong>{{ 'configurator.title' | translate }}</strong>
    <button type="button" class="layout-configurator__close" (click)="layoutService.hideConfigSidebar()" [attr.aria-label]="'common.close' | translate">
      <i class="pi pi-times"></i>
    </button>
  </header>

  <section>
    <p class="layout-configurator__label">{{ 'configurator.theme' | translate }}</p>
    <button type="button" class="layout-configurator__btn" (click)="layoutService.toggleDarkMode()">
      <i [class]="layoutService.isDarkTheme() ? 'pi pi-sun' : 'pi pi-moon'"></i>
      {{ layoutService.isDarkTheme() ? ('configurator.toLight' | translate) : ('configurator.toDark' | translate) }}
    </button>
  </section>

  <section>
    <p class="layout-configurator__label">{{ 'configurator.menuMode' | translate }}</p>
    <div class="layout-configurator__row">
      <button
        type="button"
        class="layout-configurator__chip"
        [class.is-active]="layoutService.layoutConfig().menuMode === 'static'"
        (click)="setMenuMode('static')"
      >
        {{ 'configurator.static' | translate }}
      </button>
      <button
        type="button"
        class="layout-configurator__chip"
        [class.is-active]="layoutService.layoutConfig().menuMode === 'overlay'"
        (click)="setMenuMode('overlay')"
      >
        {{ 'configurator.overlay' | translate }}
      </button>
    </div>
  </section>

  <p class="layout-configurator__hint">
    {{ 'configurator.hint' | translate }}
  </p>
</div>
