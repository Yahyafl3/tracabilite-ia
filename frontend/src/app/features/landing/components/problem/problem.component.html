<section id="probleme" class="section">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">{{ 'landing.problem.eyebrow' | translate }}</span>
      <h2 class="section-title">{{ 'landing.problem.title' | translate }}</h2>
      <p class="section-subtitle">{{ 'landing.problem.subtitle' | translate }}</p>
    </div>

    <div class="problem-grid">
      @for (item of problems; track item.titleKey; let i = $index) {
        <article class="problem-card" appReveal [revealDelay]="i * 120">
          <span class="problem-card__icon">
            <app-icon [name]="item.icon" [size]="26" />
          </span>
          <h3 class="problem-card__title">{{ item.titleKey | translate }}</h3>
          <p class="problem-card__text">{{ item.textKey | translate }}</p>
        </article>
      }
    </div>
  </div>
</section>
