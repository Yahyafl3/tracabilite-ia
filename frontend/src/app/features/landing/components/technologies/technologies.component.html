<section id="technologies" class="section section--soft">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">{{ 'landing.tech.eyebrow' | translate }}</span>
      <h2 class="section-title">{{ 'landing.tech.title' | translate }}</h2>
      <p class="section-subtitle">{{ 'landing.tech.subtitle' | translate }}</p>
    </div>

    <div class="tech-grid">
      @for (group of groups; track group.titleKey; let i = $index) {
        <article class="tech-card" appReveal [revealDelay]="(i % 3) * 80">
          <div class="tech-card__head">
            <span class="tech-card__icon">
              <app-icon name="server" [size]="22" />
            </span>
            <h3 class="tech-card__title">{{ group.titleKey | translate }}</h3>
          </div>
          <ul class="tech-card__list">
            @for (item of group.items; track item) {
              <li>{{ item }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
