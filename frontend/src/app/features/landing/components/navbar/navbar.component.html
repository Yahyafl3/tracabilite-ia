<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="container navbar__inner">
    <a
      class="brand"
      href="#accueil"
      (click)="scrollTo('accueil'); $event.preventDefault()"
      [attr.aria-label]="('app.name' | translate) + ' — ' + ('landing.nav.home' | translate)"
    >
      <app-logo class="brand__mark" [size]="38" />
      <span class="brand__name">{{ 'app.name' | translate }}</span>
    </a>

    <nav class="nav-links" [class.nav-links--open]="menuOpen()" [attr.aria-label]="'nav.application' | translate">
      @for (link of links; track link.target) {
        <a
          class="nav-links__item"
          [href]="'#' + link.target"
          (click)="scrollTo(link.target); $event.preventDefault()"
          >{{ link.labelKey | translate }}</a
        >
      }

      <div class="nav-links__actions">
        <a
          class="nav-links__login"
          routerLink="/auth/login"
          (click)="menuOpen.set(false)"
        >
          {{ 'landing.nav.login' | translate }}
        </a>
        <a
          class="btn btn-primary nav-links__cta"
          routerLink="/auth/login"
          (click)="menuOpen.set(false)"
        >
          {{ 'landing.nav.openApp' | translate }}
          <app-icon name="arrow-right" [size]="18" />
        </a>
      </div>
    </nav>

    <div class="nav-actions">
      <a
        class="nav-actions__login"
        routerLink="/auth/login"
      >
        {{ 'landing.nav.login' | translate }}
      </a>
      <a
        class="btn btn-primary nav-actions__cta"
        routerLink="/auth/login"
      >
        {{ 'landing.nav.openApp' | translate }}
        <app-icon name="arrow-right" [size]="18" />
      </a>
      <app-language-switcher />
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? ('landing.nav.themeLight' | translate) : ('landing.nav.themeDark' | translate)"
        [title]="'topbar.appearance' | translate"
      >
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" [size]="20" />
      </button>

      <button
        type="button"
        class="nav-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? ('landing.nav.closeMenu' | translate) : ('landing.nav.openMenu' | translate)"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="26" />
      </button>
    </div>
  </div>
</header>
